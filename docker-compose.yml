services:
  cr-dashboard:
    image: cr-dashboard:latest
    build: .
#    ports:
#      - "8080:80"
    volumes:
      - cr-dashboard-data:/var/lib/cr-dashboard
    # All runtime values come from the gitignored .env.local, so they can be
    # changed after the image is built (edit the file, then `docker compose up -d`).
    env_file:
      - .env.local
    restart: unless-stopped

volumes:
  cr-dashboard-data:
