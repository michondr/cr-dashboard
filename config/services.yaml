services:
    _defaults:
        autowire: true
        autoconfigure: true
        # Runtime DB access must use the same WAL + busy_timeout connection as
        # the tests (ConnectionFactory). Doctrine-bundle's default sqlite
        # connection applies none of those PRAGMAs, so concurrent writers (a
        # full backfill vs. the refresh worker or a cron sync) fail with
        # "database is locked" instead of waiting for the lock.
        bind:
            Doctrine\DBAL\Connection: '@app.dbal.connection'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    # The ConnectionFactory-owned connection: WAL journaling, a 5s busy
    # timeout and foreign keys on. Doctrine-bundle's own default connection
    # stays untouched for migrations/schema tooling.
    app.dbal.connection:
        class: Doctrine\DBAL\Connection
        factory: ['@App\Shared\Infrastructure\Persistence\ConnectionFactory', 'create']

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\Review\Infrastructure\Mercure\HmacTokenProvider:
        arguments:
            $secret: '%env(MERCURE_JWT_SECRET)%'

    Symfony\Component\Mercure\Jwt\TokenProviderInterface: '@App\Review\Infrastructure\Mercure\HmacTokenProvider'

    Symfony\Component\Mercure\HubInterface:
        class: Symfony\Component\Mercure\Hub
        arguments:
            $url: '%env(MERCURE_URL)%'
            $jwtProvider: '@Symfony\Component\Mercure\Jwt\TokenProviderInterface'

    App\Review\Infrastructure\Mercure\MercureSubscriptionReaderInterface: '@App\Review\Infrastructure\Mercure\HttpMercureSubscriptionReader'

    App\Config\AppConfig:
        arguments:
            $databasePath: '%env(DATABASE_PATH)%'
            $gitlabUrl: '%env(GITLAB_URL)%'
            $gitlabGroup: '%env(GITLAB_GROUP)%'
            $gitlabToken: '%env(GITLAB_TOKEN)%'
            $gitlabRps: '%env(float:GITLAB_RPS)%'
            $gitlabProjects: '%env(csv:GITLAB_PROJECTS)%'
            $retentionDays: '%env(int:RETENTION_DAYS)%'
            $requiredApprovals: '%env(int:REQUIRED_APPROVALS)%'
            $jiraUrl: '%env(JIRA_URL)%'
            $slackToken: '%env(SLACK_TOKEN)%'
            $slackChannel: '%env(SLACK_CHANNEL)%'
            $appUrl: '%env(APP_URL)%'
            $projectRoot: '%kernel.project_dir%'
