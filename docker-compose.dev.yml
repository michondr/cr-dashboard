# Primary compose file — run the app straight from the source checkout so code
# edits are visible without rebuilding the image: nginx and php-fpm read files
# from disk on every request. The image only needs a rebuild when dependencies
# (composer.json/lock) or the Dockerfile itself change.
#
# Runs the same scheduled jobs as production: docker/crontab is mounted over
# /etc/crontab (nightly app:sync at 03:00, app:rank-users at 04:33), so the
# stack keeps the database fresh on its own.
#
# The override is loaded alongside so the container is routed through the
# shared Traefik and served at cr.michondr.space:
#
#   docker compose -f docker-compose.dev.yml -f docker-compose.override.yml up -d --build
#   docker compose -f docker-compose.dev.yml -f docker-compose.override.yml exec cr-dashboard php /app/bin/console app:sync --full   # first run / fresh volume
#
# The production stack (docker-compose.yml: baked image, authoritative
# classmap) is the alternative for a build-time-checked deploy. Both stacks
# share the fixed container_name recruitis-cr-dashboard, so only one can run
# at a time:
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml down
services:
  cr-dashboard:
    image: cr-dashboard:dev
    build:
      context: .
      args:
        # Don't bake the classmap-authoritative autoloader: with the source
        # bind-mounted below, classes added to src/ must resolve via PSR-4.
        CLASSMAP_AUTHORITATIVE: ""
    ports:
      - "8080:80"
    env_file:
      - .env.local
    volumes:
      # Live source — served fresh on every request, no restart needed either.
      - ./public:/app/public   # frontend SPA
      - ./src:/app/src         # backend
      - ./config:/app/config
      - ./bin:/app/bin
      # The database volume. Both compose files live in the same checkout, so
      # the volume key resolves to the same <project>_cr-dashboard-data volume
      # on the host — the production stack mounts it too.
      - cr-dashboard-data:/var/lib/cr-dashboard
      # The real crontab — the same scheduled jobs as production (nightly
      # app:sync at 03:00, app:rank-users at 04:33). Mounted so job changes
      # apply without rebuilding the image.
      - ./docker/crontab:/etc/crontab:ro
    restart: unless-stopped

volumes:
  cr-dashboard-data:
