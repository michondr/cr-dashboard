<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Code Review Dashboard</title>
    <link rel="stylesheet" href="vendor/uplot.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <h1>Code Review Dashboard</h1>
        <div class="sync-status" id="sync-status">Loading…</div>
        <div class="refresh-control">
            <div class="seg-control" id="refresh-interval" role="group" aria-label="Auto-refresh interval">
                <button type="button" class="seg-control-option" data-value="0">Off</button>
                <button type="button" class="seg-control-option" data-value="60">1m</button>
                <button type="button" class="seg-control-option" data-value="300">5m</button>
                <button type="button" class="seg-control-option" data-value="900">15m</button>
            </div>
            <button
                type="button"
                class="refresh-countdown"
                id="refresh-countdown"
                title="Refresh now"
            >05:00</button>
        </div>
        <div class="user-filter">
            <label for="user-filter-select" class="user-filter-label">My view</label>
            <select id="user-filter-select" class="user-filter-select">
                <option value="">Everyone</option>
            </select>
            <button type="button" id="user-clear" class="user-clear" hidden>Clear</button>
        </div>
    </header>

    <main class="layout">
        <section class="mr-panel">
            <div class="mr-header" aria-hidden="true">
                <span class="col-project">Project</span>
                <span class="col-jira">Jira</span>
                <span class="col-title">Title</span>
                <span class="col-desc">Description</span>
                <span class="col-author">Author</span>
                <span class="col-state">Status</span>
                <span class="col-age">Age</span>
                <span class="col-first">1st App</span>
                <span class="col-approvers">Approvers</span>
                <span class="col-pipe">Pipe</span>
                <span class="col-commits">Commits</span>
            </div>
            <div class="mr-list" id="mr-list"></div>
        </section>

        <section class="stats-panel" id="stats-panel"></section>
    </main>

    <script src="vendor/uplot.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
