server {
    listen 80;
    server_name _;
    root /app/public;

    index index.php;

    # Static files are served directly; everything else goes to the front
    # controller so Symfony routing handles /api/data and the dashboard page.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Never serve dotfiles (e.g. .env.local).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
