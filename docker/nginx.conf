server {
    listen 80;
    server_name _;
    root /app/public;

    index index.html index.php;

    # The dashboard is the static public/index.html SPA (app.js fetches
    # /api/data). Serve index.html for "/", real files directly, and fall back
    # to the Symfony front controller only for non-static paths such as /api/*.
    # fastcgi_params preserves $request_uri, so Symfony still routes /api/data
    # correctly even though the internal redirect targets /index.php.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Reverse-proxy to the Mercure hub (supervisord program, listening on
    # 127.0.0.1:3000) so the browser subscribes same-origin and no extra port
    # needs to be exposed. SSE responses must not be buffered.
    location /.well-known/mercure {
        proxy_pass http://127.0.0.1:3000/.well-known/mercure;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Never serve dotfiles (e.g. /app/.env materialized by the entrypoint).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
